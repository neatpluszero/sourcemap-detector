<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">{..} Sourcemap Detector</h1>
        <span id="count-badge" class="count-badge hidden">0</span>
      </header>

      <nav id="domains" class="domains hidden" aria-label="Domains"></nav>

      <div id="status" class="status">
        <p id="status-text">Scanning...</p>
      </div>

      <div id="results" class="results hidden">
        <ul id="sourcemap-list" class="sourcemap-list"></ul>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <p>No sourcemaps detected on this page.</p>
      </div>

      <footer id="actions" class="actions hidden">
        <label class="actions__filter" title="Copy and Export only maps confirmed downloadable">
          <input type="checkbox" id="only-exposed" checked />
          Only exposed
        </label>
        <button id="btn-copy" class="btn btn-primary">Copy All</button>
        <button id="btn-export" class="btn btn-secondary">Export TXT</button>
      </footer>
    </div>

    <script src="../shared/utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
